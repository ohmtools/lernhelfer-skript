<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Setzt shadcns .dark vor dem ersten Bild, damit dunkle Geräte nicht
         weiß aufblitzen; ThemeProvider hält es danach aktuell. Inline statt
         public/dark.js wie in DESIGN.md, weil die Seite eine einzige Datei ist
         (die Datei gibt es dort wegen der CSP, die ein Artefakt nicht hat). -->
    <script>
      document.documentElement.classList.toggle(
        "dark",
        matchMedia("(prefers-color-scheme: dark)").matches,
      );
    </script>
    <title>%TITEL%</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Diese Seite braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
